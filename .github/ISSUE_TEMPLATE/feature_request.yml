name: Feature request
description: Propose a GitLab workflow or compatibility improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow gap
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: GitLab scope
      placeholder: "GitLab.com, Self-Managed, specific version, MCP/glab"
