name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codex_glab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository structure
        run: |
          python3 scripts/validate_plugin.py
          python3 scripts/validate_oauth.py
          python3 scripts/validate_chatgpt_binding.py
          python3 scripts/validate_public_config.py

      - name: Validate registered ChatGPT App packaging
        run: |
          rm -rf /tmp/gitlab-chatgpt-app-ci
          python3 scripts/build_chatgpt_app.py \
            --app-id plugin_asdk_app_ci_123 \
            --mcp-url https://gitlab-mcp.example.com/mcp \
            --output /tmp/gitlab-chatgpt-app-ci
          test -f /tmp/gitlab-chatgpt-app-ci/plugins/gitlab-self-hosted/.app.json
          grep -q 'plugin_asdk_app_ci_123' /tmp/gitlab-chatgpt-app-ci/plugins/gitlab-self-hosted/.app.json
          grep -q '"apps": "./.app.json"' /tmp/gitlab-chatgpt-app-ci/plugins/gitlab-self-hosted/.codex-plugin/plugin.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/mcp-server/package.json

      - name: Install MCP server dependencies
        working-directory: packages/mcp-server
        run: npm install

      - name: Test and build MCP server
        working-directory: packages/mcp-server
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/codex_glab_test
        run: npm run check

      - name: Build production container
        run: docker build -t codex-plugin-glab:test .
