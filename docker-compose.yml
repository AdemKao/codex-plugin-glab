services:
  gitlab-mcp:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3333:3333"
    volumes:
      - gitlab-mcp-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    profiles:
      - postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: codex_glab
    volumes:
      - gitlab-mcp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codex_glab"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  gitlab-mcp-data:
  gitlab-mcp-postgres:
